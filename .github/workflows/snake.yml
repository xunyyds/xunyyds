name: Snake 7-Color Random On Load
on:
  schedule:
    - cron: "0 1-22/3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/**
      - .github/workflows/snake.yml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: xunyyds
          outputs: |
            dist/snake.svg?color_snake=ff0000&palette=github
            dist/snake-dark.svg?color_snake=ff0000&palette=github-dark

      - name: Add per-visit random color (7-color)
        run: |
          python3 scripts/snake_color.py dist/snake.svg dist/snake-dark.svg

      - name: Render activity stats
        env:
          STATS_USER: xunyyds
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          python3 scripts/render_stats.py --out dist

      - name: Deploy to snake branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: snake
